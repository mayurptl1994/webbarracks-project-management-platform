services:
  - type: web
    name: webbarracks-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm --workspace=@webbarracks/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
